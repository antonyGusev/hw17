[project]
name = 'embedded-tests'
version = '0.1.0'
requires-python = '>=3.11'
dependencies = [
  'pytest>=8.2',
  'pytest-asyncio',
  'allure-pytest>=2.13',
  'pyserial>=3.5',
  'poethepoet>=0.29',
  'bleak',
  'packaging',
  'python-dotenv',
  'requests',
  'opencv-python',
  'numpy',
  'ruff',
  'esptool',
]

[tool.setuptools.packages.find]
where = ['.']
include = [
  'framework*',
  'lib*',
]
exclude = [
  'tests*',
  'framework_tests*',
]

[tool.pytest.ini_options]
testpaths = ['tests']
python_files = ['test_*.py']
pythonpath = ['.']
addopts = '-v --tb=short'
log_cli = true
log_cli_level = 'INFO'
log_cli_format = '%(message)s'
markers = [
  'ota_gatekeeper: critical OTA checks that block the entire test run',
  'smoke: general device smoke tests',
  'regression: regression test suite',
  'positive: positive test cases',
  'negative: negative test cases',
  'first: tests that must run across just flashed device',
  'fw_min(version): minimum firmware version required',
  'fw_only(version): run test only on the specified firmware version',
  'tc(id): test case ID from CHECK_LIST.md',
]

[tool.poe.tasks]
default_state_tests = 'pytest -m first'
gatekeeper = 'pytest -m ota_gatekeeper'
smoke = 'pytest -m smoke'
regression = 'pytest -m regression'
positive_tests = 'pytest -m positive'
negative_tests = 'pytest -m negative'
all = 'pytest'
unit = 'pytest unit_tests'
full_cycle = 'python run_firmware_matrix.py'
full_cycle_no_flash = 'python run_firmware_matrix.py --no-flash'

ota = 'pytest tests/ota'
lamp = 'pytest tests/lamp'
wifi = 'pytest tests/wifi'

flash = "python flash_device.py"

lint = 'ruff check .'
format = 'ruff format .'
init = 'pip install -e .'

# Keep existing commands unchanged (and keep pytest argument forwarding).
# Example: poe logged lamp --log-level warning
[tool.poe.tasks.logged]
cmd = 'poe ${suite}'
help = 'Run an existing task with a selected step logger level'

[tool.poe.tasks.logged.args.suite]
positional = true
choices = [
  'default_state_tests', 'gatekeeper', 'smoke', 'regression',
  'positive_tests', 'negative_tests', 'all', 'unit',
  'ota', 'lamp', 'wifi', 'full_cycle', 'full_cycle_no_flash', 'flash',
]

[tool.poe.tasks.logged.args.STEP_LOG_LEVEL]
options = ['--log-level']
default = 'verbose'
choices = ['debug', 'verbose', 'warning', 'error', 'silent']

# Allure always records driver/controller steps, independent of STEP_LOG_LEVEL.
# PYTEST_ADDOPTS is inherited by pytest subprocesses in the firmware matrix.
[tool.poe.tasks.reported]
cmd = 'poe ${suite}'
help = 'Run an existing suite and collect steps plus HIL artifacts in Allure'
env = { STEP_LOG_REPORTER = 'allure', PYTEST_ADDOPTS = '--alluredir=artifacts/allure-results' }

[tool.poe.tasks.reported.args.suite]
positional = true
choices = [
  'default_state_tests', 'gatekeeper', 'smoke', 'regression',
  'positive_tests', 'negative_tests', 'all', 'unit',
  'ota', 'lamp', 'wifi', 'full_cycle', 'full_cycle_no_flash',
]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
line-ending = 'auto'
